# reCamera AI result to GPIO trigger configuration.
# Install location on device: /userdata/recamera_trigger.conf

GPIO=188
TARGET_CLASSES=cat
MIN_SCORE=0.10
PULSE_SECONDS=3
COOLDOWN_SECONDS=60
WS_URI=wss://127.0.0.1/ws/inference/results

# Save one local JPG when GPIO is actually triggered.
# The official capture API requires an output path under /mnt.
SAVE_SNAPSHOT=1
SNAPSHOT_DIR=/mnt/rc_mmcblk0p8/recamera_trigger_snapshots
SNAPSHOT_EVENT_CSV=/mnt/rc_mmcblk0p8/recamera_trigger_snapshots/trigger_events.csv
SNAPSHOT_MAX_FILES=1000
SNAPSHOT_DELETE_BATCH=100
SNAPSHOT_MIN_FREE_MB=1024
SNAPSHOT_COMPRESS=1
SNAPSHOT_FFMPEG_Q=5
SNAPSHOT_TARGET_KB=500

# Optional. Leave empty to let the script read the local API key from reCamera.
API_KEY=
