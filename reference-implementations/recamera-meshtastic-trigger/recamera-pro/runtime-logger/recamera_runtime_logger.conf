# reCamera runtime and AI-event monitor configuration.
# Install location on device: /userdata/recamera_runtime_logger.conf

LOG_CSV=/userdata/recamera_runtime_monitor.csv
HEARTBEAT_INTERVAL_SECONDS=60

# These classes are recorded as trigger-worthy events in the same CSV table.
TARGET_CLASSES=cat
MIN_SCORE=0.10
EVENT_COOLDOWN_SECONDS=60

# For report estimation only. The logger cannot read an external solar battery SOC.
POWER_WATTS=5.6
BATTERY_WH=385

# Keep these aligned with the GPIO trigger program for easier comparison.
GPIO_EXPECTED=188
GPIO_PULSE_SECONDS=3

WS_URI=wss://127.0.0.1/ws/inference/results

# Optional. Leave empty to let the script read the local API key from reCamera.
API_KEY=
